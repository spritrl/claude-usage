name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and bundle
        run: ./scripts/bundle.sh
      - name: Package
        run: ditto -c -k --keepParent build/ClaudeUsage.app build/ClaudeUsage.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage.app
          path: build/ClaudeUsage.app.zip

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClaudeUsage.app
      - uses: softprops/action-gh-release@v2
        with:
          files: ClaudeUsage.app.zip
          generate_release_notes: true

  cask:
    name: Update Homebrew cask
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - name: Check token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_GITHUB_TOKEN is not set, skipping cask update. Run scripts/update-cask.sh locally."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: token
      - uses: actions/checkout@v4
        if: steps.token.outputs.skip != 'true'
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.skip != 'true'
        with:
          name: ClaudeUsage.app
      - name: Clone tap
        if: steps.token.outputs.skip != 'true'
        run: git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/spritrl/homebrew-tap.git" tap
      - name: Update cask
        if: steps.token.outputs.skip != 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: ./scripts/update-cask.sh "${GITHUB_REF_NAME#v}" ClaudeUsage.app.zip "$PWD/tap"
