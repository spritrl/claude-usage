name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version to push to the Homebrew tap (e.g. 1.0.0)"
        required: true

jobs:
  build:
    name: Build (macOS)
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and bundle
        run: ./scripts/bundle.sh
      - name: Package
        run: ditto -c -k --keepParent build/ClaudeUsage.app build/ClaudeUsage.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage.app
          path: build/ClaudeUsage.app.zip

  release:
    name: Release
    needs: build
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClaudeUsage.app
      - uses: softprops/action-gh-release@v2
        with:
          files: ClaudeUsage.app.zip
          generate_release_notes: true

  cask:
    name: Update Homebrew cask
    needs: release
    # Runs after a tagged release, or on manual dispatch for an existing release.
    if: >-
      !cancelled() && needs.release.result != 'failure' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
        id: meta
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v${{ steps.meta.outputs.version }}" -p ClaudeUsage.app.zip --clobber
      - name: Set up deploy key
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/tap_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
      - name: Clone tap
        run: git clone --depth 1 git@github.com:spritrl/homebrew-tap.git tap
      - name: Update cask
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: ./scripts/update-cask.sh "${{ steps.meta.outputs.version }}" ClaudeUsage.app.zip "$PWD/tap"
