name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and bundle
        run: ./scripts/bundle.sh
      - name: Package
        run: ditto -c -k --keepParent build/ClaudeUsage.app build/ClaudeUsage.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage.app
          path: build/ClaudeUsage.app.zip

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClaudeUsage.app
      - uses: softprops/action-gh-release@v2
        with:
          files: ClaudeUsage.app.zip
          generate_release_notes: true
